# Golden fixtures of the S06 template playbooks (tests/unit/test_template_playbooks.py).
# Each entry: a goal question the complexity router must route to the template (one small table,
# every template enabled), the plan it builds at autonomy 3 and 2, its gates, outputs, default
# limits and the plan hash at version 1 over scope 'scope-fixture'. A change here is a new
# playbook version: bump the manifest's version, never edit a published one in place.
kpi_review:
  id: playbook.kpi_review
  version: 1.0.0
  question: How are our incident KPIs doing this quarter by assignment group?
  steps_autonomy_3:
  - context
  - metadata
  - profile
  - quality
  - hypotheses
  - insights
  - verify
  - dataset
  - semantic
  - visualize
  - finalize
  steps_autonomy_2:
  - plan_approval
  - context
  - metadata
  - profile
  - quality
  - hypotheses
  - insights
  - verify
  - dataset
  - semantic
  - visualize
  - finalize
  depends_on:
    context: []
    metadata: []
    profile:
    - metadata
    quality:
    - profile
    hypotheses:
    - context
    - profile
    - quality
    insights:
    - hypotheses
    - test:*
    - followups:*
    verify:
    - insights
    dataset:
    - verify
    semantic:
    - dataset
    visualize:
    - semantic
    finalize:
    - visualize
  approval_gates:
  - plan_approval
  side_effects: []
  outputs:
  - kpi_review
  - dashboard_draft
  default_limits:
    max_steps: 30
    max_duration_s: 1800
    max_cost_usd: 0.5
    max_replans: 1
    max_retries: 6
  inputs_required:
  - question
  plan_hash_autonomy_3: c812472c2b0d63274e0a466b820c40e8656f4a4ea35fb0428785113be0dd7292
  route:
    features:
      table_count: 1
      estimated_scan_rows: 5000
    tier: low
    playbook: playbook.kpi_review
