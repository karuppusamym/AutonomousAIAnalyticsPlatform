# Template (S06 §3.8): funnel conversion. Rates by segment and over time, so drop-off is located by
# step and by who; findings are verified before the draft dashboard.
apiVersion: analystos/v1
kind: Playbook
id: playbook.funnel
version: 1.0.0
summary: Funnel conversion (step rates by segment and over time, verified drop-off findings, a draft funnel dashboard)
determinism: model
side_effect: write_internal
cost_class: llm_small
certification: {status: tested, evidence: tests/integration/test_template_playbooks.py}
tags: [template, funnel]
spec:
  framing: true
  inputs:
    - {name: question, type: question, required: true}
    - {name: events, type: event, required: true, description: "The funnel steps, in order"}
    - {name: segments, type: segment, description: "Who to compare"}
    - {name: period, type: period}
  outputs: [funnel_report, dashboard_draft]
  default_limits: {max_steps: 35, max_duration_s: 2400, max_cost_usd: 0.6, max_replans: 2, max_retries: 6}
  router:
    intents: ['funnel', 'conversion', 'drop[- ]?offs?', 'step[- ]to[- ]step', 'abandon(ment|ed)?']
    tiers: [medium, complex]
    priority: 20
  steps:
    - key: plan_approval
      use: agent.supervisor
      behaviour: plan_approved
      title: Wait for plan approval
      type: approval_gate
      payload: plan
      when: "run.autonomy_level <= 2"
      gates_roots: true
    - {key: context, use: agent.context, title: Load business context and the funnel definition}
    - {key: metadata, use: agent.metadata, title: Discover technical metadata of selected tables}
    - key: relationships
      use: agent.metadata
      behaviour: discover_relationships
      title: Discover and validate relationships
      after: [metadata]
      optional: true
    - {key: profile, use: agent.profiler, title: Profile selected tables, after: [metadata]}
    - key: quality
      use: agent.data_quality
      title: Detect data-quality issues in the event data
      after: [profile, relationships]
      optional: true
    - key: hypotheses
      use: agent.investigator
      title: Frame step conversion and drop-off as testable hypotheses
      after: [context, profile, quality]
      params: {prefer_method_tags: [segment, ml]}
      replan_boundary: [{trigger: redirect, reset: self_and_downstream}]
      expands:
        - {prefix: "test:", use: agent.data_scientist}
        - {prefix: "followups:", use: agent.investigator, behaviour: follow_ups}
    - key: insights
      use: agent.insight
      title: Turn supported drop-offs into evidence-backed findings
      after: [hypotheses, "test:*", "followups:*"]
    - key: verify
      use: agent.critic
      title: REV verification of every finding
      after: [insights]
      replan_boundary: [{trigger: finding_rejected, reset: downstream}]
    - {key: dataset, use: agent.sql, title: Build the funnel dataset, after: [verify]}
    - {key: semantic, use: agent.semantic, title: Define and validate the conversion KPIs, after: [dataset]}
    - {key: visualize, use: agent.visualization, title: Design the draft funnel dashboard, after: [semantic]}
    - {key: finalize, use: agent.supervisor, title: Consolidate the funnel review, after: [visualize]}
