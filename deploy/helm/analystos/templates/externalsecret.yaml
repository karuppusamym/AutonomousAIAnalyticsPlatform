{{- /* External Secrets Operator (S12 §1/§5): `secrets.existingSecret` (and `additional` ones) synced from a
       vault. Hooks run before the migration Job (weight -10) so it finds the Secret; the kubelet retries a pod
       until ESO has written it. creationPolicy Orphan: replacing the hook object never deletes the Secret. */ -}}
{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- if not $es.secretStoreRef.name }}
{{- fail "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled" }}
{{- end }}
{{- $items := list (dict "name" .Values.secrets.existingSecret "data" $es.data "dataFrom" $es.dataFrom) }}
{{- range $es.additional }}
{{- $items = append $items . }}
{{- end }}
{{- range $items }}
{{- if not (or .data .dataFrom) }}
{{- fail (printf "externalSecrets: %s needs data or dataFrom" .name) }}
{{- end }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "analystos.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ default $es.refreshInterval .refreshInterval }}
  secretStoreRef:
    {{- toYaml (default $es.secretStoreRef .secretStoreRef) | nindent 4 }}
  target:
    name: {{ .name }}
    creationPolicy: Orphan
    deletionPolicy: Retain
  {{- with .data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
