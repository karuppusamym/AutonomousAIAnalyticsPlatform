apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "analystos.fullname" . }}-config
  labels:
    {{- include "analystos.labels" . | nindent 4 }}
data:
  {{- include "analystos.configData" . | nindent 2 }}
{{- if .Values.models.customConfig }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "analystos.fullname" . }}-models
  labels:
    {{- include "analystos.labels" . | nindent 4 }}
data:
  models.yaml: |
    {{- .Values.models.customConfig | nindent 4 }}
{{- end }}
{{- if .Values.oidc.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "analystos.fullname" . }}-oidc
  labels:
    {{- include "analystos.labels" . | nindent 4 }}
data:
  oidc.yaml: |
    {{- .Values.oidc.mapping | nindent 4 }}
{{- end }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "analystos.serviceAccountName" . }}
  labels:
    {{- include "analystos.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
