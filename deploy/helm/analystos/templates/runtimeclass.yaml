{{- if and .Values.gvisor.enabled .Values.gvisor.createRuntimeClass }}
# gVisor (S12 §1, ADR-012): the compute roles run under runsc. Cluster-scoped: create it once per cluster
# (other releases set createRuntimeClass=false and reuse it). GKE Sandbox ships its own `gvisor` class.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.gvisor.runtimeClassName }}
  labels:
    {{- include "analystos.labels" . | nindent 4 }}
handler: {{ .Values.gvisor.handler }}
{{- with .Values.gvisor.nodeSelector }}
scheduling:
  nodeSelector:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
