# AnalystOS Helm chart (P4-S04). Defaults are a small single-zone install against EXTERNAL
# Postgres (pgvector), Redis, Temporal and Superset; `values-ha.yaml` layers the HA sizing on top and
# `values-airgapped.yaml` the air-gapped mode. Secrets are never values: every credential comes from a
# Kubernetes Secret (`secrets.existingSecret`), read into the pods with envFrom.

image:
  registry: ""                         # e.g. registry.internal:5000 for an offline bundle (scripts/bundle_images.sh)
  repository: analystos/app
  tag: ""                              # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
webImage:
  repository: analystos/web
  tag: ""
imagePullSecrets: []

# ANALYSTOS_ENV: anything but `dev` skips the demo accounts with known passwords at seed time.
env: production

# Non-secret settings (rendered into a ConfigMap as ANALYSTOS_* variables).
config:
  temporalAddress: temporal-frontend.temporal.svc:7233
  temporalNamespace: default
  temporalQueuePrefix: analystos     # every pool of one installation must share the prefix
  supersetUrl: http://superset.superset.svc:8088
  webUrl: https://analystos.example.com
  corsOrigins: https://analystos.example.com
  orchestrator: temporal
  graphEnabled: false                # Neo4j is an optional projection (spec v3 §8)
  # Embedding storage (ADR-0007): pgvector, or `array` (real[], no extension) for a Postgres where the
  # `vector` extension cannot be installed. Choose before the first migration; `analystos knowledge reembed` converts.
  vectorBackend: pgvector            # pgvector | array
  # Python sandbox (python.execute) isolation, P4-02. `process` (default): every child gets fresh
  # mount/network/PID/IPC/UTS namespaces inside the worker pod (the pod is the outer container): no
  # network, read-only root with a tmpfs scratch, private /proc, rlimits incl. processes, no capabilities.
  # Where the node cannot create namespaces (RuntimeDefault seccomp blocks unshare(2) without user
  # namespaces) the sandbox is REFUSED and /api/health reports checks.sandbox.available=false; give the
  # pool that runs it a seccomp profile allowing unshare (workers.<pool>.podSecurityContext) or gVisor.
  # `container` needs a Docker socket (not in pods); `off` is development only and refused when env is
  # production.
  sandboxIsolation: process          # process | auto | container | off
  extra: {}                          # any other ANALYSTOS_* setting, e.g. {ANALYSTOS_QUERY_MAX_ROWS: "20000"}

secrets:
  # Name of a Secret (created by you, or by External Secrets Operator when externalSecrets.enabled) holding at least ANALYSTOS_DATABASE_URL, ANALYSTOS_ANALYTICS_LOADER_URL,
  # ANALYSTOS_ANALYTICS_READER_URL, ANALYSTOS_ANALYTICS_BUILDER_URL (the BuildGateway's login) and
  # ANALYSTOS_ANALYTICS_WRITER_URL (the managed output writer's login; for both, outside
  # env=dev its password must not be the development default, or provisioning and builds refuse), ANALYSTOS_REDIS_URL, ANALYSTOS_JWT_SECRET, ANALYSTOS_BOOTSTRAP_ADMIN_PASSWORD,
  # ANALYSTOS_SUPERSET_PASSWORD; optional OPENROUTER_API_KEY, ANTHROPIC_API_KEY, AZURE_OPENAI_API_KEY,
  # ANALYSTOS_OIDC_CLIENT_SECRET and source passwords referenced by `secret_ref: env:NAME`.
  existingSecret: analystos-secrets

# External Secrets Operator (S12 §1/§5): the Secret above is synced from a vault (Vault, AWS/GCP/Azure secret
# managers, ...) instead of being created by hand. The ExternalSecret is a pre-install/pre-upgrade hook (weight
# -10) so the migration Job finds the Secret; creationPolicy Orphan keeps the Secret when the hook object is
# replaced. `secret_ref: env:NAME` of a source reads NAME from this same Secret: add it to `data`.
externalSecrets:
  enabled: false
  apiVersion: external-secrets.io/v1  # external-secrets.io/v1beta1 for ESO < 0.17
  refreshInterval: 1h
  secretStoreRef: {name: "", kind: ClusterSecretStore}   # required when enabled
  # [{secretKey: ANALYSTOS_DATABASE_URL, remoteRef: {key: analystos/prod, property: database_url}}, ...]
  data: []
  # [{extract: {key: analystos/prod}}]: every property of one vault entry becomes a key
  dataFrom: []
  # More ExternalSecrets, e.g. the PgBouncer auth Secret or file-mounted source credentials:
  # [{name: analystos-pgbouncer-auth, data: [...], dataFrom: [...]}]
  additional: []

# Connection pools per process and plane (P4-S05, src/analystos/db/pools.py). Every API process,
# worker process and compute-pool child holds its own pools, so Postgres needs roughly
# processes x (control + analytics + loader maxima) connections without a pooler. `mode: none` drops
# the client-side pool (a connection per checkout) for use behind PgBouncer.
database:
  pools:
    mode: queue                      # queue | none
    recycleSeconds: -1               # below any idle cut-off between the pods and Postgres
    control: {size: 10, maxOverflow: 20, timeoutSeconds: 30}
    analytics: {size: 5, maxOverflow: 5, timeoutSeconds: 30}   # the reader identity, per source URL
    loader: {size: 2, maxOverflow: 3, timeoutSeconds: 30}
  # The Secret's control/loader/reader URLs go through a transaction-mode pooler (turns off psycopg's
  # server-side prepared statements). Forced on when pgbouncer.enabled.
  transactionPooler: false

# Optional in-release PgBouncer (spec v3 §8), off by default. Transaction pooling for the control
# plane and the analytics loader/reader; point those three URLs in the Secret at
# `<release>-analystos-pgbouncer:5432`. Keep ANALYSTOS_ANALYTICS_BUILDER_URL direct: dbt sets its role
# for the whole session. Logins are checked with auth_query against pg_shadow as the Secret's
# DB_USER/DB_PASSWORD (a role allowed to read pg_shadow), so workspace roles need no userlist.
pgbouncer:
  enabled: false
  image: {repository: edoburu/pgbouncer, tag: v1.23.1-p3}
  replicas: 2
  postgresHost: ""                   # required when enabled
  postgresPort: 5432
  existingSecret: ""                 # Secret with DB_USER and DB_PASSWORD (the auth_query login)
  authDbname: postgres
  poolMode: transaction
  maxClientConn: 2000                # client connections (cheap): every pod's pools together
  defaultPoolSize: 20                # server connections per (database, user) and replica
  maxDbConnections: 40               # server connections per database and replica
  # Keep the control database's pool above the concurrent analysis slots (runbook "Connection pooling"):
  # a client waiting longer than this for a server connection gets an error and the activity retries.
  queryWaitTimeoutSeconds: 60
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: "1", memory: 256Mi}
  pdb: {enabled: false, minAvailable: 1}

# Model providers. `modelsConfig` picks the file inside the image (config/models*.yaml) or a mounted one.
models:
  modelsConfig: ""                   # "" = config/models.yaml (OpenRouter)
  customConfig: ""                   # inline models YAML; mounted at /etc/analystos/models.yaml and used when set

airGapped:
  enabled: false                     # ANALYSTOS_AIR_GAPPED: only `egress: internal` providers, rules/local_classifier decisions
  localModel:
    url: ""                          # ANALYSTOS_LOCAL_LLM_URL, e.g. http://vllm.llm.svc:8000/v1
  # Egress the pods keep under the NetworkPolicy (cluster DNS is always allowed). CIDRs of the external
  # Postgres / Redis / Temporal / Superset / local model / IdP / sources.
  allowedEgressCidrs: []

oidc:
  enabled: false
  issuer: ""
  clientId: ""
  redirectUri: ""                    # https://<host>/api/auth/oidc/callback
  scopes: "openid email profile groups"
  groupsClaim: groups
  providerName: Single sign-on
  passwordLogin: true                # keep a break-glass local admin
  mapping: |                         # config/oidc.yaml format: groups -> roles, claims -> ABAC attributes
    platform_admin_groups: []
    workspace_roles: []
    attributes: {department: department, region: region}  # clearances are never IdP-mapped (platform-controlled)
    require_group: false

migrations:
  enabled: true                      # pre-install/pre-upgrade Job: analystos migrate && analystos seed
  backoffLimit: 2
  # Key in the Secret holding the `app_migrator` login (S01 §5: the owner role, DDL; used only by this Job).
  # "" = the Job uses ANALYSTOS_DATABASE_URL like the pods. Migrations stay expand/contract compatible with
  # the previous release (S12 §1): the old pods keep running against the new schema during the rollout.
  databaseUrlKey: ""

# OpenShift (restricted-v2 SCC): the namespace assigns the UID/GID range, so the pods must not pin
# runAsUser/runAsGroup/fsGroup. runAsNonRoot, seccomp RuntimeDefault, no privilege escalation and dropped
# capabilities stay. The images run as any UID in group 0 (deploy/docker/Dockerfile: g=u on writable paths).
openshift:
  enabled: false

# gVisor for the compute roles (S12 §1, S07 / ADR-012): pools with `gvisor: true` get runtimeClassName. The
# node pool needs runsc installed (GKE Sandbox: runtimeClassName gvisor exists already; elsewhere set
# createRuntimeClass and the handler your containerd config names). A pool may set its own runtimeClassName.
# Isolated pools under this class also get ANALYSTOS_WORKER_REQUIRE_RUNTIME=gvisor: the worker refuses to start
# (exit 78) when its kernel is not gVisor's, e.g. a node whose handler silently maps to runc. A pool's
# `requireRuntime` overrides it (gvisor | kata | "" for no check).
gvisor:
  enabled: false
  runtimeClassName: gvisor
  createRuntimeClass: false
  handler: runsc
  nodeSelector: {}                   # RuntimeClass scheduling.nodeSelector (nodes that have runsc)

# KEDA ScaledObjects on the Temporal task queues (S12 §1): a pool with `keda.enabled` scales on its queue's
# backlog instead of CPU (its HPA is not rendered). Needs KEDA >= 2.17 (the `temporal` scaler) in the cluster.
keda:
  enabled: false
  pollingInterval: 15
  cooldownPeriod: 300
  temporal:
    endpoint: ""                     # "" = config.temporalAddress
    namespace: ""                    # "" = config.temporalNamespace
    queueTypes: "workflow,activity"
    authenticationRef: ""            # a TriggerAuthentication (mTLS / API key for Temporal Cloud)

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

api:
  replicas: 2
  port: 8000
  uvicornWorkers: 2
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}
  autoscaling: {enabled: false, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70}
  pdb: {enabled: true, minAvailable: 1}
  service: {type: ClusterIP, port: 8000}

# One Deployment per Temporal task-queue pool (P4-S01, config/task_queues.yaml). Per-process slots,
# executor type and activity timeouts are baked into the image; keep the compute pool's cpu limit at
# least its process-pool size (task_queues.yaml `compute.max_concurrent`, default 4).
# In-flight workflows must be drained (or continue-as-new) before an upgrade that changes workflow code.
workers:
  analysis:            # I/O-bound agent steps + AnalysisWorkflow; the `worker-query` role (gateway statements)
    queues: analysis
    role: query
    replicas: 2
    keda: {enabled: true, minReplicas: 2, maxReplicas: 6, targetQueueSize: 10}
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    autoscaling: {enabled: false, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70}
    pdb: {enabled: true, minAvailable: 1}
  compute:             # CPU-bound statistics in a process pool; the `worker-compute` role (gVisor)
    queues: compute
    role: compute
    gvisor: true
    keda: {enabled: true, minReplicas: 2, maxReplicas: 12, targetQueueSize: 4}
    # podSecurityContext: {}   # e.g. a Localhost seccomp profile that allows unshare(2) for the sandbox
    replicas: 2
    resources:
      requests: {cpu: "2", memory: 3Gi}
      limits: {cpu: "4", memory: 6Gi}
    autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 12, targetCPUUtilizationPercentage: 75}
    pdb: {enabled: true, minAvailable: 1}
  publish:             # BI side effects; few replicas keep the destination's rate limits honest
    queues: publish
    role: publish
    replicas: 1
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    autoscaling: {enabled: false}
    pdb: {enabled: false}
  crawl:               # metadata crawls
    queues: crawl
    role: crawl
    replicas: 1
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    autoscaling: {enabled: false}
    pdb: {enabled: false}
  # ELT builds (P4-E04/E06) run dbt Core as a separate executable, which is NOT in the app image: the
  # pool stays at 0 replicas (the queue answers queue_ping only) until an image with dbt
  # (ANALYSTOS_DBT_EXECUTABLE) and ANALYSTOS_ANALYTICS_BUILDER_URL in the Secret is supplied.
  # worker:query (S02-T1): runs gateway statements when config ANALYSTOS_QUERY_TRANSPORT=temporal; the only pool
  # that needs source credentials then (the API runs with ANALYSTOS_PROCESS_ROLE=api).
  query:
    queues: query
    replicas: 2
    resources:
      requests: {cpu: 250m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
    autoscaling: {enabled: false}
    pdb: {enabled: true, minAvailable: 1}
  elt:
    queues: elt
    role: elt
    replicas: 0
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
    autoscaling: {enabled: false}
    pdb: {enabled: false}

  # Isolated compute pools (ADR-0022, P7-06): opt-in, deployed only with replicas > 0. No ConfigMap or Secret
  # (a worker given a credential refuses to start), their own NetworkPolicy (DNS, the API, Temporal only;
  # isolatedPools.temporalEgress is then required), and the API's ANALYSTOS_ISOLATED_POOLS follows them.
  # Build compute-ml from an image with the `ml` extra (image override per pool is not modelled yet: the
  # default image is EXTRAS=standard, which has it).
  compute-py:          # recipe snapshot jobs (P6-04); later notebook Python cells (P7-12)
    queues: compute-py
    role: compute
    gvisor: true
    isolated: true
    replicas: 0
    resources:
      requests: {cpu: "1", memory: 2Gi}
      limits: {cpu: "2", memory: 4Gi}
    autoscaling: {enabled: false}
    pdb: {enabled: false}
  compute-ml:          # classical ML with bounded search (P5-04, ADR-0024)
    queues: compute-ml
    role: compute
    gvisor: true
    isolated: true
    replicas: 0
    resources:
      requests: {cpu: "2", memory: 4Gi}
      limits: {cpu: "4", memory: 8Gi}
    autoscaling: {enabled: false}
    pdb: {enabled: false}

isolatedPools:
  # NetworkPolicy `to` peers of the Temporal frontend, e.g.
  #   [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: temporal}}}] or [{ipBlock: {cidr: 10.0.4.0/24}}]
  temporalEgress: []
  temporalPort: 7233

scheduler:
  # Claim-then-execute: several replicas never fire a schedule twice, so 2 is safe for HA.
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  pdb: {enabled: false, minAvailable: 1}

web:
  replicas: 2
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  pdb: {enabled: true, minAvailable: 1}
  service: {type: ClusterIP, port: 80}

ingress:
  enabled: false
  className: ""
  host: analystos.example.com
  annotations: {}
  tls: []                            # [{secretName: analystos-tls, hosts: [analystos.example.com]}]

networkPolicy:
  # Forced on when airGapped.enabled. Off by default only because the chart cannot know the CIDRs of the
  # external Postgres / Redis / model APIs; turn it on to bound the pods' own egress (DNS, the release's
  # pods, airGapped.allowedEgressCidrs). Sandbox children never have the pod's network (sandboxIsolation).
  enabled: false
  # Per-role policies (S12 §1/§5) instead of the one release-wide policy: each role gets ingress only from
  # whom it serves and egress only to the peer groups that `roles` lists for it. Isolated compute pools
  # keep their own policy (networkpolicy-isolated.yaml) either way.
  perRole: false
  ingressFrom: []                    # peers allowed to reach api/web, e.g. [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}]
  monitoringFrom: []                 # Prometheus peers allowed to scrape the metrics ports
  egress:                            # NetworkPolicy `to` peers per group ({ipBlock: {cidr: ...}} or selectors)
    platform: []                     # control-plane Postgres / PgBouncer, Redis, Temporal frontend
    models: []                       # model API hosts or the egress proxy in front of them (the model-host allowlist)
    sources: []                      # customer data sources and the analytics database
    superset: []
    idp: []                          # OIDC issuer / JWKS
    otel: []                         # OpenTelemetry collector
  roles:                             # role -> peer groups it may reach (the release's own API is always reachable)
    api: [platform, models, sources, superset, idp, otel]
    query: [platform, models, sources, otel]          # worker-analysis: agent steps, gateway statements
    compute: [platform, otel]                         # statistics on staged handles: no model, no source
    publish: [platform, superset, otel]
    crawl: [platform, models, sources, otel]
    elt: [platform, sources, otel]
    all: [platform, models, sources, superset, otel]  # values-small: one worker serves every queue
    scheduler: [platform, models, sources, otel]
    migrate: [platform]
    ops: [platform]                                   # audit-verify / rls-check CronJobs

serviceAccount:
  create: true
  name: ""
  automountToken: false

# Observability (S12 §2). Metrics: the API serves /metrics on its http port; workers and the scheduler on
# `metricsPort` (ANALYSTOS_METRICS_PORT). Processes of one pod merge through ANALYSTOS_METRICS_DIR. The
# Prometheus Operator objects (PodMonitor, PrometheusRule) and Grafana dashboard ConfigMaps are opt-in.
monitoring:
  metricsPort: 9464
  podMonitor: {enabled: false, interval: 30s, labels: {}}
  prometheusRule:
    enabled: false
    labels: {}
    queueBacklogThreshold: 100       # Temporal task-queue backlog above this for 10 min
    # The Temporal server's backlog gauge (matching service, Temporal >= 1.21; a metrics prefix changes its name).
    temporalBacklogMetric: temporal_approximate_backlog_count
    providerErrorRate: 0.05          # model provider error share over 10 min
    budgetRatio: 0.8                 # spend above this share of a budget
    slo:                             # owner targets; burn-rate alerts page at 14.4x (1h) and ticket at 6x (6h)
      askLatencySeconds: 3           # Ask (POST) time to first byte; must be a histogram bucket bound
      askLatencyTarget: 0.95
      runSuccessTarget: 0.95
      availabilityTarget: 0.995
  grafanaDashboards: {enabled: false, labels: {grafana_dashboard: "1"}, folder: AnalystOS}
  otel:
    enabled: false                   # traces need the image built with EXTRAS=...,otel
    endpoint: ""                     # OTEL_EXPORTER_OTLP_ENDPOINT, e.g. http://otel-collector.observability:4318

# Production checks as CronJobs (S12 §5): a failed Job pages through the PrometheusRule (kube-state-metrics).
ops:
  auditVerify:                       # `analystos audit verify` (+ `export` to WORM storage when exportDir is set)
    enabled: true
    schedule: "15 2 * * *"
    exportDir: ""                    # a mounted WORM path (ANALYSTOS_AUDIT_EXPORT_DIR); "" = verify only
    exportVolume: {}                 # e.g. {persistentVolumeClaim: {claimName: audit-worm}}
  rlsCheck:                          # `analystos ops rls-check`: every tenant-owned table has RLS + policy + trigger
    enabled: true
    schedule: "45 2 * * *"
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpread: false                # spread each Deployment across zones (values-ha.yaml turns it on)
