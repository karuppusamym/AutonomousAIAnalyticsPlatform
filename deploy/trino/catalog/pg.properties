# The demo source database (deploy/trino/source-pg), read through a SELECT-only login. Values come from the
# container environment (compose.yaml, profile `federation`); none is a production credential.
connector.name=postgresql
connection-url=jdbc:postgresql://${ENV:TRINO_PG_HOST}:${ENV:TRINO_PG_PORT}/${ENV:TRINO_PG_DATABASE}
connection-user=${ENV:TRINO_PG_USER}
connection-password=${ENV:TRINO_PG_PASSWORD}
