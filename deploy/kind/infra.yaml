# Development infrastructure for the kind proof install (deploy/kind/README.md): Postgres (pgvector, the compose
# init scripts from deploy/postgres via the `pg-init` ConfigMap), Redis and Temporal (auto-setup on that Postgres).
# No persistent volumes: the cluster is thrown away after the proof. Production uses external services (values.yaml).
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, labels: {app.kubernetes.io/name: postgres}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres}}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          args: ["postgres", "-c", "max_connections=300"]
          env:
            - {name: POSTGRES_USER, value: analystos}
            - {name: POSTGRES_PASSWORD, value: analystos}
            - {name: POSTGRES_DB, value: analystos}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "analystos", "-d", "analystos"]}
            periodSeconds: 5
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - {name: init, configMap: {name: pg-init}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, labels: {app.kubernetes.io/name: redis}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata: {labels: {app.kubernetes.io/name: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: temporal, labels: {app.kubernetes.io/name: temporal}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: temporal}}
  template:
    metadata: {labels: {app.kubernetes.io/name: temporal}}
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.25
          env:
            - {name: DB, value: postgres12}
            - {name: DB_PORT, value: "5432"}
            - {name: POSTGRES_USER, value: analystos}
            - {name: POSTGRES_PWD, value: analystos}
            - {name: POSTGRES_SEEDS, value: postgres}
            - {name: BIND_ON_IP, value: 0.0.0.0}
          ports: [{containerPort: 7233}]
          readinessProbe:
            tcpSocket: {port: 7233}
            periodSeconds: 5
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata: {name: temporal}
spec:
  selector: {app.kubernetes.io/name: temporal}
  ports: [{port: 7233, targetPort: 7233}]
