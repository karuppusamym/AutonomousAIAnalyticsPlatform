# Supply chain (spec S12 §1/§5, S12-T2): secrets scan, Helm lint, image SBOMs (Syft), vulnerability scan (Grype),
# signing (cosign keyless) and a weekly CVE rescan. Pull requests build and scan; pushes to main also publish to
# GHCR, sign each image by digest and attach the SBOM as a signed attestation.
#
# Actions are pinned to release tags; pin them to commit SHAs (Dependabot / Renovate `pinDigests`) before the
# production gate. Thresholds: a fixable CRITICAL or HIGH vulnerability fails the build.
name: supply-chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # weekly CVE rescan of the main images (new advisories against unchanged images)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # the whole history: a secret removed later is still leaked
      - name: gitleaks (default rules + .gitleaks.toml allowlist)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --redact --exit-code 1 \
            --report-format sarif --report-path /repo/gitleaks.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: gitleaks, path: gitleaks.sarif, if-no-files-found: ignore}

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: {version: v3.16.4}
      - uses: astral-sh/setup-uv@v3
      - run: uv venv -p 3.11 .venv && uv pip install -e ".[dev]"
      - name: helm lint + rendered-chart tests (roles, KEDA, gVisor, ESO, SCC, monitoring)
        env: {ANALYSTOS_HELM: helm}
        run: .venv/bin/pytest -q tests/unit/test_helm_chart.py tests/unit/test_supply_chain.py

  images:
    runs-on: ubuntu-latest
    needs: [gitleaks]
    permissions:
      contents: read
      packages: write          # push to GHCR (main only)
      id-token: write          # cosign keyless signing (main only)
      security-events: write   # SARIF upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: app, context: ., file: deploy/docker/Dockerfile, args: "EXTRAS=standard,otel"}
          - {name: web, context: web, file: web/Dockerfile, args: ""}
          - {name: sandbox, context: deploy/sandbox, file: deploy/sandbox/Dockerfile, args: ""}
          - {name: superset, context: deploy/superset, file: deploy/superset/Dockerfile, args: ""}
          - {name: mock, context: ., file: deploy/docker/Dockerfile.mock, args: ""}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/analystos-${{ matrix.name }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: false
      - name: SBOM (Syft, SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          upload-artifact: true
      - name: Vulnerability scan (Grype; fixable high/critical fail)
        id: scan
        uses: anchore/scan-action@v6
        with:
          sbom: sbom-${{ matrix.name }}.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.scan.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-${{ matrix.name }}
      - name: Push (main)
        if: env.PUBLISH == 'true'
        id: push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
        if: env.PUBLISH == 'true'
      - name: Sign by digest and attest the SBOM (cosign keyless, OIDC)
        if: env.PUBLISH == 'true'
        run: |
          ref="$IMAGE@${{ steps.push.outputs.digest }}"
          cosign sign --yes "$ref"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.name }}.spdx.json" "$ref"
          cosign verify "$ref" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Web dependencies are locked (package-lock.json) and have no high advisories
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - uses: astral-sh/setup-uv@v3
      - name: Python dependency audit (pip-audit over the resolved standard install)
        run: |
          uv venv -p 3.11 .venv && uv pip install -e ".[standard,otel]" pip-audit
          .venv/bin/pip-audit --skip-editable --progress-spinner off
