# The process-mining demo workspace `analystos demo-seed` builds next to the incident one (src/analystos/demo/seed.py,
# `--only process` builds just this one). Domain data lives here, in the pack. Not a capability manifest.
workspace:
  name: ServiceNow process mining (demo)
  description: "Demo workspace created by `analystos demo-seed`: how incidents, changes and catalog tasks really flow."
  objective: >-
    Mine the ServiceNow task activity log: how incidents, change requests and catalog tasks are created, assigned,
    reassigned, worked, put on hold, resolved, closed or cancelled. Find where cases wait, which teams hand work back
    and forth, which steps are skipped against the expected process, and what gets cancelled and when.
  policy: {require_approved_metrics: false}

source:
  kind: servicenow
  name: ServiceNow task activity
  secret_ref: env:ANALYSTOS_SOURCE_SECRET_SERVICENOW
  username: admin
  page_size: 10000
  # u_task_activity is the flattened lifecycle log (see process_models.yaml); the records it describes come along
  tables: [u_task_activity, incident, change_request, sc_task]
  select: [u_task_activity, incident, change_request, sc_task]

brief:
  - {group: decision, field: question, value: "Where do incidents, changes and catalog tasks lose time, get bounced between teams, or skip required steps?"}
  - {group: decision, field: audience, value: "Head of IT service management and the process owners for incident, change and request fulfilment"}
  - {group: decision, field: intended_action, value: "Fix the worst handover loops, enforce change authorization, and cut on-hold waiting in fulfilment"}
  - {group: time_measures, field: timezone, value: Europe/London}

# Saved process analyses (Work -> Process; they appear in Outputs). The mapping comes from process_models.yaml.
process:
  table: u_task_activity
  analyses:
    - {segment: incident, name: "Incident process (demo)"}
    - {segment: change_request, name: "Change process (demo)"}
    - {segment: sc_task, name: "Catalog task process (demo)"}
  # The event log as tables (u_task_activity_cases / _transitions), then an investigation on them: the same agents,
  # gateway, verification and approvals as any other data (Work -> Process -> Use this process everywhere).
  investigation:
    objective: >-
      Why do some incidents, change requests and catalog tasks take much longer than others? Compare case duration by
      kind of case and status, by how often the work changed hands, by rework and by whether the case followed the
      expected path, and find where cases wait longest between steps.

# Approved semantic model for the demo (ADR-016, decided under owner delegation 2026-10-30; dev and demo only): over the
# case and transition tables built above. Proposed by admin@, approved by approver@ (see demo.yaml `semantic`).
semantic:
  description: Process measures over the ServiceNow task activity log, reviewed for the pilot.
  datasets:
    - name: transitions
      table: u_task_activity_transitions
      description: One row per step-to-step move of a case.
      fields:
        - {name: from_at, label: Step started, time: true}
        - {name: segment, label: Case type, dimension: true}
        - {name: transition, label: Transition, dimension: true}
        - {name: from_activity, label: From step, dimension: true}
        - {name: to_activity, label: To step, dimension: true}
        - {name: wait_hours}
        - {name: handover, label: Handover, dimension: true}
    - name: cases
      table: u_task_activity_cases
      primary_key: [case_id]
      description: One row per case (incident, change request or catalog task).
      fields:
        - {name: case_id}
        - {name: started_at, label: Started, time: true}
        - {name: segment, label: Case type, dimension: true}
        - {name: status, label: Status, dimension: true}
        - {name: duration_hours}
        - {name: rework, label: Rework, dimension: true}
  metrics:
    - name: avg_wait_hours
      display_name: Average wait hours
      description: Average hours between one step and the next.
      dataset: transitions
      expression: AVG(wait_hours)
      format: hours
      synonyms: [average wait, wait time, waiting time]
    - name: handover_rate
      display_name: Handover rate
      description: Share of step-to-step moves where the work changed hands.
      dataset: transitions
      expression: AVG(CASE WHEN handover THEN 1.0 ELSE 0.0 END)
      format: percent
      synonyms: [share of handovers]
    - name: case_count
      display_name: Case count
      description: Number of cases in the activity log.
      dataset: cases
      expression: COUNT(*)
      format: number
      synonyms: [cases, number of cases, how many cases]
    - name: mean_case_duration_hours
      display_name: Mean case duration hours
      description: Average hours from a case's first to its last activity.
      dataset: cases
      expression: AVG(duration_hours)
      format: hours
      synonyms: [case duration, average case duration, cycle time]
    - name: rework_rate
      display_name: Rework rate
      description: Share of cases that repeated a step.
      dataset: cases
      expression: AVG(CASE WHEN rework THEN 1.0 ELSE 0.0 END)
      format: percent
      synonyms: [share of rework]
