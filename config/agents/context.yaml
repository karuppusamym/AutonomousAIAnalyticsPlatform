# Agent manifest (spec v3 §3.4). Every field is enforced: see src/analystos/capabilities/agents.py.
apiVersion: analystos/v1
kind: Agent
id: agent.context
version: 1.1.0
summary: Context Agent
entry: python:analystos.agents.context_agent:load_context
determinism: model
side_effect: write_internal
cost_class: llm_small
certification:
  status: certified
  evidence: tests/integration/test_e2e_local_run.py
tags:
- context_retrieval
- term_resolution
- ambiguity_detection
spec:
  role: Context Agent
  goal: Retrieves enterprise context (Context2AI or local store) with layered retrieval, resolves business terminology
    to technical fields and flags ambiguity.
  capabilities:
  - skill.glossary_linking
  tools:
  - context.search
  - graph.neighborhood
  - artifact.write
  prompt_version: v1
  model_purposes: [glossary_suggestion]
  budget:
    llm_calls: 1
  policies:
    max_rows_extract: 500000
    pii_access: allowed
    approval_for_publish: true
    max_iterations: 3
  phase: mvp
  output_contract:
    - type: context_package
      schema:
        type: object
        required: [objective, tables, glossary, metrics]
        properties: {objective: {type: string}, tables: {type: array}, glossary: {type: array}, metrics: {type: array}}
