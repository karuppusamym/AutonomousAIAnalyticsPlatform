# Model routing (§27). Agents ask for a PURPOSE; purposes map to PROFILES; profiles list models
# in fallback order. Every model must be on the allowlist, and a workspace policy may narrow it
# further. If no allowed model can serve a profile the call fails visibly (fail closed).
providers:
  openrouter:
    kind: chat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    # region: eu   # optional; unset = unknown, which fails closed under a workspace data_residency policy
  typesafe:
    # TypeSafe Jev: decision model served by the OpenRouter Decisions API. Returns typed answers
    # (choice / noul / score) with probabilities instead of text.
    kind: decision
    base_url: https://openrouter.ai/api/alpha/decisions
    api_key_env: OPENROUTER_API_KEY

allowlist:
  # OpenRouter low-cost reasoning tier (the frontier families may be disabled at runtime).
  - deepseek/deepseek-v4-flash-0731
  - qwen/qwen3-32b
  - qwen/qwen3-14b
  - openai/gpt-oss-120b
  - typesafe/jev-1.13
  - anthropic/claude-sonnet-5
  - anthropic/claude-opus-5
  - openai/gpt-5.4
  - openai/gpt-5.4-mini
  - google/gemini-3.5-flash
  - google/gemini-3.5-flash-lite
  - deepseek/deepseek-v4-flash

# Versioned price table (P4-T07). Prices are USD per million tokens. They serve (a) the pre-call
# approval estimate (policy.expensive_model_approval_usd) and (b) the recorded cost when the provider
# does not report usage.cost (model_call.cost_source = price_table@<prices_version>). A model with no
# price and no provider-reported cost is recorded as cost_source=missing_price and surfaced in
# /api/admin/token-savings; it is never silently counted as $0. Bump prices_version on every change.
# `region` overrides the provider region; unset = unknown (fails closed under data_residency).
prices_version: "2026-09-29"  # OpenRouter list prices read 2026-09-29; typesafe/jev-1.13 is not sold there (unpriced)
# `prompt_cache: true` = the router sends `cache_control` breakpoints after the stable prompt prefix
# (static system text + workspace header, P4-T04); needed for Anthropic models, also via OpenRouter.
models:
  deepseek/deepseek-v4-flash-0731: {input_usd_per_mtok: 0.018, output_usd_per_mtok: 0.32}
  qwen/qwen3-32b: {input_usd_per_mtok: 0.08, output_usd_per_mtok: 0.28}
  qwen/qwen3-14b: {input_usd_per_mtok: 0.12, output_usd_per_mtok: 0.24}
  openai/gpt-oss-120b: {input_usd_per_mtok: 0.037, output_usd_per_mtok: 0.17}
  anthropic/claude-sonnet-5: {input_usd_per_mtok: 2.0, output_usd_per_mtok: 10.0, prompt_cache: true}
  anthropic/claude-opus-5: {input_usd_per_mtok: 5.0, output_usd_per_mtok: 25.0, prompt_cache: true}
  openai/gpt-5.4: {input_usd_per_mtok: 2.5, output_usd_per_mtok: 15.0}
  openai/gpt-5.4-mini: {input_usd_per_mtok: 0.75, output_usd_per_mtok: 4.5}
  google/gemini-3.5-flash: {input_usd_per_mtok: 1.5, output_usd_per_mtok: 9.0}
  google/gemini-3.5-flash-lite: {input_usd_per_mtok: 0.3, output_usd_per_mtok: 2.5}
  deepseek/deepseek-v4-flash: {input_usd_per_mtok: 0.14, output_usd_per_mtok: 0.28}

# Cheap first, escalate (2026-09-26): chat profiles answer from small models; `escalation_models` is the
# large tier the router moves to only when the small answer fails deterministic validation (unparseable
# JSON, schema failure, SQL the gateway still rejects after repairs, no usable hypotheses, a narrative
# the numbers guard rejects). Per-purpose policy: `escalation` below and admin `llm.escalation`
# (never | on_validation_failure | always_large; the max_quality preset = always_large = Sonnet first).
profiles:
  reasoning_strong:
    models: [qwen/qwen3-32b, deepseek/deepseek-v4-flash-0731]
    escalation_models: [openai/gpt-oss-120b]
    temperature: 0.2
    max_tokens: 4000
    timeout_seconds: 120
    reasoning_effort: minimal  # strict-JSON purposes checked by code: no hidden reasoning eating max_tokens
  coding:
    models: [deepseek/deepseek-v4-flash-0731, qwen/qwen3-32b]
    escalation_models: [openai/gpt-oss-120b]
    temperature: 0.0
    max_tokens: 2500
    timeout_seconds: 90
    reasoning_effort: minimal  # strict-JSON purposes checked by code: no hidden reasoning eating max_tokens
  analytical_reasoning:
    models: [qwen/qwen3-32b, deepseek/deepseek-v4-flash-0731]
    escalation_models: [openai/gpt-oss-120b]
    temperature: 0.2
    max_tokens: 4000
    timeout_seconds: 120
    reasoning_effort: minimal  # strict-JSON purposes checked by code: no hidden reasoning eating max_tokens
  low_cost:
    models: [qwen/qwen3-14b, deepseek/deepseek-v4-flash-0731]
    escalation_models: [qwen/qwen3-32b]  # a narrative the numbers guard rejects
    temperature: 0.2
    max_tokens: 2000
    timeout_seconds: 60
    reasoning_effort: minimal  # strict-JSON purposes checked by code: no hidden reasoning eating max_tokens
  # Verification must come from a different model family than the primary analyst profile.
  independent_model_family:
    models: [deepseek/deepseek-v4-flash-0731, openai/gpt-oss-120b]
    temperature: 0.0
    max_tokens: 2000
    timeout_seconds: 90
    reasoning_effort: minimal  # strict-JSON purposes checked by code: no hidden reasoning eating max_tokens
    exclude_families: [anthropic]
  decision:
    provider: typesafe
    models: [typesafe/jev-1.13]  # pinned: aliases can shift verdicts
    timeout_seconds: 20

# Execution ladder per purpose (spec v3 §4.1, ADR-0012), cheapest rung first:
# cache (L0) -> registry (L1) -> rules (L2) -> decision (L3) -> llm_small (L4) -> llm_large (L5).
# A rules/registry rung before the model rung = deterministic first ("auto"); the model rung is only
# reached when the deterministic result is insufficient. Model rungs name the routed profile's class
# (low_cost -> llm_small, decision -> decision, otherwise llm_large); the recorded answered_by is the
# profile actually used (a budget downgrade answers from llm_small). Admins override per purpose in
# platform settings (llm.ladders / llm.purpose_modes). A purpose without an entry is model first.
ladders:
  planning: [cache, rules, llm_large]
  hypothesis_generation: [cache, registry, rules, llm_large]
  follow_up_generation: [cache, rules, llm_large]
  sql_generation: [cache, registry, llm_large]
  # P7-02 (ADR-0019): choose a SemanticQuery (names only) for a governed question; the rules rung is an exact
  # metric / display name / glossary-synonym match, the model only when no rule matched and the question names
  # a metric word. The compiler validates whatever is chosen; a model never writes this path's SQL.
  semantic_query: [cache, rules, llm_small]
  # Ask analyst mode: the rules plan / template synthesis answer first. The planning model only for a one-step plan
  # of a compound-looking question (validated: 1..4 non-empty, distinct steps); the synthesis model only when set to
  # `always`, and its text is kept only when every number binds to a computed fact and cites its step.
  analyst_planning: [cache, rules, llm_small]
  analyst_synthesis: [cache, rules, llm_small]
  sql_repair: [cache, llm_large]
  statistical_interpretation: [cache, llm_large]
  insight_narrative: [cache, rules, llm_small]
  semantic_modeling: [cache, rules, llm_large]
  dashboard_design: [cache, rules, llm_small]
  feedback_interpretation: [cache, rules, llm_large]
  summarization: [cache, rules, llm_small]
  agent_actions: [cache, rules, llm_small]
  ml_spec_proposal: [cache, rules, llm_small]  # P5-06: the ml_practitioner proposes MLSpec inputs; rules = default_actions
  metadata_enrichment: [cache, rules, llm_small]
  domain_classification_assist: [cache, rules, llm_small]
  # Stream E: the glossary scan's rules find terms and code sets; the model only drafts a definition for a
  # candidate the rules could not define (validated, screened; a person approves every draft).
  glossary_suggestion: [cache, rules, llm_small]
  # Data shape: rules name the patterns of a table (event log, time series, ML candidate); the model only proposes an event
  # log for a table the rules left unexplained, and code verifies the mapping against the profile.
  data_shape_proposal: [cache, rules, llm_small]
  verification: [cache, llm_large]  # runs only when the workspace policy opts in (independent_model_verification)
  hypothesis_priority: [cache, rules, decision]
  risk_check: [cache, decision]  # escalate-only; no longer called at publish (the tier is fixed high)
  feedback_classification: [cache, rules, decision]
  chart_selection: [cache, rules, decision]
  rev_second_opinion: [cache, decision]
  stop_check: [cache, rules, decision]
  alert_triage: [cache, decision, rules]
  ask_route: [cache, rules, decision]
  clarify_needed: [cache, rules, decision]
  metric_match: [cache, rules, decision]
  join_path_choice: [cache, rules, decision]
  decision_structured: [cache, llm_small]  # the DecisionService's structured-output backend
  # P6-08: the `engineer` agent proposes recipe nodes and PipelineSpecs. The rules rung is skill.pipeline_propose's
  # catalog-derived staging recipe; whatever a model proposes passes the recipe IR validator before any compile.
  pipeline_proposal: [cache, rules, llm_small]
  # S13 Request Desk triage: rules classify R1-R9 first; a typed decision (JEV, decision profile) picks a class only when
  # no rule matched; the small chat model last. Every answer is one of R1-R9 and code applies the policy floors (an
  # export or sensitive request is never routed to an unreviewed auto answer by a model).
  request_triage: [cache, rules, decision, llm_small]
  health_probe: [cache, llm_small]  # never cached (not a cacheable purpose); admin `GET /api/admin/models/health?probe=1`: one tiny billable request

routing:
  planning: reasoning_strong
  hypothesis_generation: analytical_reasoning
  follow_up_generation: analytical_reasoning
  sql_generation: coding
  semantic_query: low_cost
  analyst_planning: low_cost
  analyst_synthesis: low_cost
  sql_repair: coding
  statistical_interpretation: analytical_reasoning
  insight_narrative: low_cost
  semantic_modeling: coding
  dashboard_design: low_cost
  feedback_interpretation: coding
  summarization: low_cost
  pipeline_proposal: low_cost  # P6-08 engineer agent; the IR validator decides
  ml_spec_proposal: low_cost  # proposals only: skill.ml_propose_spec validates, readiness checks decide
  agent_actions: low_cost  # declarative agents (agents/generic.py) propose typed actions; default_actions are the rule path
  metadata_enrichment: low_cost
  domain_classification_assist: low_cost
  glossary_suggestion: low_cost
  data_shape_proposal: low_cost
  verification: independent_model_family
  # JEV decision purposes
  hypothesis_priority: decision
  risk_check: decision
  feedback_classification: decision
  chart_selection: decision
  rev_second_opinion: decision
  stop_check: decision
  alert_triage: decision
  ask_route: decision
  clarify_needed: decision
  metric_match: decision
  join_path_choice: decision
  # DecisionService `llm_structured` backend: a small chat model answering with a strict JSON schema
  decision_structured: low_cost
  health_probe: low_cost
  request_triage: low_cost  # its `decision` rung uses the decision profile (desk/triage.py)

# Escalation policy per purpose (defaults; admin `llm.escalation` overrides). Purposes not listed use
# `default`. A purpose whose profile has no escalation_models never escalates.
escalation:
  default: on_validation_failure
  purposes:
    metadata_enrichment: never   # batch crawl prompts; the deterministic semantics already ran
    domain_classification_assist: never  # proposals only; the catalog keeps its rule classification
    glossary_suggestion: never   # drafts only; a person approves every glossary term
    data_shape_proposal: never   # proposals only; code verifies and a person confirms
    decision_structured: never   # the DecisionService falls back to its rules backend
    agent_actions: never         # declarative agents have default_actions
    pipeline_proposal: never     # the engineer agent has default_actions (rules)
    ml_spec_proposal: never      # the ml_practitioner has default_actions (the rule path)
    dashboard_design: never
    summarization: never
    health_probe: never
    semantic_query: never       # a refused or invalid choice falls through to the labelled ad-hoc path
    analyst_planning: never     # an invalid plan falls back to the rules plan
    request_triage: never       # an invalid class falls back to escalation (a person triages)

# DecisionService (ADR-0015, spec v3 §5). Every decision purpose declares its authority class, its
# backends in order, a timeout and (through `rules`) a deterministic fallback. Backends: jev | rules |
# local_classifier | llm_structured. No backend may grant, lower a risk, skip a gate or suppress an
# alert: the authority class is enforced in analystos/decisions/authority.py, whatever a backend answers.
#   rank                 order valid options (never drop one)
#   choose_presentation  pick among rule-valid presentations
#   escalate_only        raise risk/severity or ask the user; `rules` sets the baseline and must come first
#   route                pick a processing path among valid ones (needs calibration)
#   bounded_stop         end exploration only after the minimum work; `rules` first (needs calibration)
decisions:
  defaults:
    timeout_seconds: 3          # per decision, across its model backends; rules always run inline
    breaker_failures: 3         # consecutive failures that open a backend's circuit
    breaker_reset_seconds: 30   # open -> half-open (one probe) after this long
  purposes:
    hypothesis_priority: {kind: scores, authority: rank, backends: [jev, rules]}
    metric_match: {kind: scores, authority: rank, backends: [jev, rules]}
    join_path_choice: {kind: scores, authority: rank, backends: [rules, jev]}
    chart_selection: {kind: choice, authority: choose_presentation, backends: [rules, jev]}
    feedback_classification: {kind: choice, authority: route, backends: [jev, rules], default: redirect}
    ask_route: {kind: choice, authority: route, backends: [rules, jev, local_classifier], default: generate}
    rev_second_opinion: {kind: probability, authority: escalate_only, backends: [rules, jev]}
    alert_triage: {kind: probability, authority: escalate_only, backends: [rules, jev]}
    risk_check: {kind: probability, authority: escalate_only, backends: [rules, jev]}
    clarify_needed: {kind: probability, authority: escalate_only, backends: [rules, jev]}
    stop_check: {kind: probability, authority: bounded_stop, backends: [rules, jev], min_rounds: 1, min_supported: 3, stop_at: 0.85}
